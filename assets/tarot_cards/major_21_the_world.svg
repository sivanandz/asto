    <circle cx="650" cy="1150" r="10" fill="none" stroke="#5a805b" stroke-width="2"/>

    <!-- Inner corner arcs -->
    <path d="M 40 80 A 40 40 0 0 1 80 40" fill="none" stroke="#fafafa" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 620 40 A 40 40 0 0 1 660 80" fill="none" stroke="#fafafa" stroke-width="1" stroke-dasharray="2,2"/>
