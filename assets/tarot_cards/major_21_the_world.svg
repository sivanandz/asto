        <circle cx="310" cy="1120" r="2"/>
        <circle cx="390" cy="1120" r="2"/>
    </g>


    <text x="350" y="140" text-anchor="middle" fill="#fafafa" font-size="32" font-weight="600" letter-spacing="4">XXI</text>
    <text x="350" y="1080" text-anchor="middle" fill="#5a805b" font-size="42" font-weight="600" letter-spacing="6">THE WORLD</text>

    <g transform="translate(0, 150)">
